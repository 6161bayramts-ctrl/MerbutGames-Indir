name: Build isolated MerbutGames Android test APK
# Rebuild after the APK source UI navigation and safe-area patch.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-test-apk.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch to build"
        required: true
        default: "apk-fix-isolated-test"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private app source
        uses: actions/checkout@v4
        with:
          repository: 6161bayramts-ctrl/merbuthansosyal
          ref: ${{ github.event.inputs.source_ref || 'apk-fix-isolated-test' }}
          token: ${{ secrets.MERBUT_SOURCE_TOKEN }}
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies and generate Android project
        working-directory: source
        run: |
          npm install
          npx cap add android
          # Android 15 (API 35) edge-to-edge opt-out for this APK test only.
          python3 - <<'PY'
          from pathlib import Path
          import re

          resource_dir = Path("android/app/src/main/res")
          patched = 0
          for styles in resource_dir.glob("values*/**/*.xml"):
              data = styles.read_text()
              def patch_style(match):
                  opening, body, closing = match.groups()
                  if "windowOptOutEdgeToEdgeEnforcement" not in body:
                      body += '''
                      <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>
                      <item name="android:statusBarColor">#0d1018</item>
                      <item name="android:windowLightStatusBar">false</item>
                      '''
                  return opening + body + closing
              updated, count = re.subn(
                  r'(<style[^>]*>)(.*?)(</style>)',
                  patch_style,
                  data,
                  flags=re.S
              )
              if count:
                  styles.write_text(updated)
                  patched += count
          if patched == 0:
              raise SystemExit("No Android style resources found to patch")
          print(f"Patched {patched} Android style definitions")
          PY
          MAIN_ACTIVITY="$(find android/app/src/main -name MainActivity.java -print -quit)"
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity.java not found"
            exit 1
          fi
          cat > "$MAIN_ACTIVITY" <<'JAVA'
          package com.merbuthan.merbutgames;

          import android.graphics.Color;
          import android.os.Bundle;
          import androidx.core.view.WindowCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
                  getWindow().setStatusBarColor(Color.rgb(13, 16, 24));
              }
          }
          JAVA
          npx cap sync android

      - name: Build debug APK
        working-directory: source/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MerbutGames-Android-Test
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
