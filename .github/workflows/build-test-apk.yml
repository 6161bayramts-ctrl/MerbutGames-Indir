name: Build isolated MerbutGames Android test APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-test-apk.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch to build"
        required: true
        default: "apk-fix-isolated-test"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private app source
        uses: actions/checkout@v4
        with:
          repository: 6161bayramts-ctrl/merbuthansosyal
          ref: ${{ github.event.inputs.source_ref || 'apk-fix-isolated-test' }}
          token: ${{ secrets.MERBUT_SOURCE_TOKEN }}
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies and generate Android project
        working-directory: source
        run: |
          npm install
          npx cap add android
          # APK-only: use the device's real status-bar inset, not a fixed dp guess.
          MAIN_ACTIVITY="$(find android/app/src/main -name MainActivity.java -print -quit)"
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity.java not found"
            exit 1
          fi
          cat > "$MAIN_ACTIVITY" <<'JAVA'
          package com.merbuthan.merbutgames;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  getWindow().setStatusBarColor(Color.rgb(13, 16, 24));

                  View webView = getBridge().getWebView();
                  ViewCompat.setOnApplyWindowInsetsListener(webView, (view, windowInsets) -> {
                      Insets statusBars = windowInsets.getInsets(WindowInsetsCompat.Type.statusBars());
                      view.setPadding(
                          view.getPaddingLeft(),
                          statusBars.top,
                          view.getPaddingRight(),
                          view.getPaddingBottom()
                      );
                      return windowInsets;
                  });
                  ViewCompat.requestApplyInsets(webView);
              }
          }
          JAVA
          npx cap sync android

      - name: Build debug APK
        working-directory: source/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MerbutGames-Android-Test
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

