name: Publish MerbutGames downloads

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Yayın sürümü (ör. 1.0.0-test1)"
        required: true
        default: "1.0.0-test1"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Private source kodunu al
        uses: actions/checkout@v4
        with:
          repository: 6161bayramts-ctrl/merbuthansosyal
          token: ${{ secrets.MERBUT_SOURCE_TOKEN }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android APK oluştur
        working-directory: source
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MerbutGames-Android
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - name: Private source kodunu al
        uses: actions/checkout@v4
        with:
          repository: 6161bayramts-ctrl/merbuthansosyal
          token: ${{ secrets.MERBUT_SOURCE_TOKEN }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Windows kurulum dosyası oluştur
        working-directory: source
        run: |
          npm install
          npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: MerbutGames-Windows
          path: source/release/*.exe
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [android, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MerbutGames-Android
          path: dist/android
      - uses: actions/download-artifact@v4
        with:
          name: MerbutGames-Windows
          path: dist/windows
      - name: Herkese açık sürümü yayımla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: MerbutGames v${{ inputs.version }}
          target_commitish: main
          generate_release_notes: true
          files: |
            dist/android/app-debug.apk
            dist/windows/*.exe
